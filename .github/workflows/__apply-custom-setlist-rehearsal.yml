name: Apply custom setlist rehearsal patch

on:
  push:
    branches:
      - feat/custom-setlist-rehearsal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply surgical patch
        run: node scripts/__patch-custom-setlist-rehearsal.mjs
      - name: Align EnsayoHub prop types
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'src/components/react/EnsayoHub.jsx';
          let source = await readFile(path, 'utf8');
          const before = " *   initialSongVoiceAssignments?: Record<string, any>;\n * }} props";
          const after = " *   initialSongVoiceAssignments?: Record<string, any>;\n *   isCustomSetlist?: boolean;\n *   shareUrl?: string;\n * }} props";
          if (!source.includes(before)) throw new Error('EnsayoHub prop type anchor not found');
          source = source.replace(before, after);
          await writeFile(path, source, 'utf8');
          NODE
      - name: Test compact setlist IDs
        run: node --experimental-strip-types scripts/test-custom-setlist-share.mjs
      - name: Verify migration history unchanged
        run: npm run test:migrations
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Remove temporary patch helpers
        run: |
          rm scripts/__patch-custom-setlist-rehearsal.mjs
          rm .github/workflows/__apply-custom-setlist-rehearsal.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Open custom setlists in rehearsal mode with compact links"
          git push origin HEAD:feat/custom-setlist-rehearsal
