name: Apply Live Director output colors

on:
  push:
    branches:
      - ux/live-director-output-colors

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI patch
        run: node scripts/__patch-live-director-output-colors.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Remove temporary helpers
        run: |
          rm scripts/__patch-live-director-output-colors.mjs
          rm .github/workflows/__apply-live-director-output-colors.yml
      - name: Commit verified UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Color-code Live Director output routing states"
          git push origin HEAD:ux/live-director-output-colors
