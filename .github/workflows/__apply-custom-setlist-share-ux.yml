name: Apply custom setlist share UX patch

on:
  push:
    branches:
      - fix/custom-setlist-share-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply surgical patch
        run: node scripts/__patch-custom-setlist-share-ux.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Remove temporary patch helpers
        run: |
          rm scripts/__patch-custom-setlist-share-ux.mjs
          rm .github/workflows/__apply-custom-setlist-share-ux.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish custom setlist share transition"
          git push origin HEAD:fix/custom-setlist-share-ux
